<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Video</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/core/assets/tool.css">
<script src="/core/assets/hub.js" defer></script>
<style>
/* Fits the window: the sample video, photos and settings on the left, the run (frames, clips, the video) on the right. */
body { height: 100vh; overflow: hidden; }
main { height: 100%; display: flex; flex-direction: column; }
.layout { flex: 1; min-height: 0; grid-template-columns: minmax(0, 1fr) 400px; }
.page { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.col { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.col > .group { flex: none; }
.col > .grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }
/* Tạo video */
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.photo { position: relative; height: 150px; background: #fff; border: 1px dashed var(--line); display: grid; place-content: center; text-align: center; color: var(--muted); cursor: pointer; overflow: hidden; padding: 8px; }
.photo:hover, .photo.dropping { background: var(--hover); border-color: var(--accent); }
.photo img, .photo video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }
.photo video { background: #000; }
.photo .x { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; padding: 0; z-index: 1; }
.photo b { color: var(--ink); font-weight: 400; display: block; margin-bottom: 4px; }
.photo .lib { position: absolute; left: 6px; bottom: 6px; height: 26px; padding: 0 10px; z-index: 1; }
#sampleBox { flex: 1; min-height: 160px; height: auto; }
/* Kho: a danh mục, then its photos or videos as a grid of thumbnails. */
.dialog.library { width: min(760px, calc(100vw - 32px)); }
.library .top { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.library .grid { height: 380px; overflow-y: auto; background: #fff; border: 1px solid var(--line); padding: 6px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; }
.library .grid img, .library .grid video { width: 104px; height: 104px; object-fit: contain; background: var(--control); border: 2px solid transparent; cursor: pointer; }
.library .grid video { width: 140px; height: 180px; background: #000; }
.library .grid img:hover, .library .grid video:hover { border-color: var(--accent); }
.library .note { margin-top: 8px; min-height: 18px; }
.settings { display: flex; gap: 16px; flex-wrap: wrap; align-items: end; }
.settings label { margin-top: 0; }
.total { margin-top: 10px; font-size: 14px; }
.total b { color: var(--accent-dark); font-weight: 600; }
/* The run */
.steps { flex: 1; min-height: 0; overflow-y: auto; background: #fff; border: 1px solid #000; padding: 8px; display: grid; gap: 6px; align-content: start; }
.step { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; align-items: center; min-height: 44px; }
.step .thumb { width: 56px; height: 42px; object-fit: cover; background: var(--control); display: block; }
.step .msg { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ok { color: #006400; } .bad { color: rgb(176, 0, 0); } .warn { color: rgb(176, 96, 0); }
#final video { width: 100%; max-height: 260px; background: #000; display: block; margin-top: 8px; }
.buttons { display: flex; gap: 8px; }
.buttons .btn { flex: 1; }
</style>
</head>
<body data-fit="1100x760">
<main>
  <header><h1>Product Video</h1></header>

  <div class="page" id="make">
    <div class="layout">
      <div class="col">
        <section class="group">
          <h2>Ảnh</h2>
          <div class="photos">
            <div class="photo" id="photoBox" tabindex="0"></div>
            <div class="photo" id="modelBox" tabindex="0"></div>
          </div>
          <label for="name">Tên sản phẩm</label>
          <input id="name" placeholder="Kệ đĩa than gỗ óc chó dáng cong">
        </section>
        <section class="group grow">
          <h2>Video mẫu (làm theo cách quay của video này)</h2>
          <div class="photo" id="sampleBox" tabindex="0"></div>
          <label for="target">Món cần thay trong video mẫu (tuỳ chọn, để trống thì thay món chính của mỗi cảnh)</label>
          <input id="target" placeholder="bàn trà kính">
          <div class="settings" style="margin-top:10px">
            <div><label>Độ phân giải</label><div class="seg" id="resolution"></div></div>
          </div>
          <div id="total" class="total"></div>
        </section>
      </div>
      <div class="col">
        <section class="group actions-col">
          <h2>Thao tác</h2>
          <div class="buttons"><button class="btn primary" id="run" type="button">Tạo video</button><button class="btn" id="stop" type="button" disabled>Dừng</button><button class="btn" id="open" type="button" disabled>Mở thư mục</button></div>
          <div class="note small" style="margin-top:8px">Chạy trong Chrome đã đăng nhập grok.com, qua extension Product Video. Video mẫu được tách cảnh rồi chia đoạn ~3 giây; mỗi đoạn: 1 ảnh Grok (~10 giây) và 1 video Grok (~1 phút).</div>
        </section>
        <section class="group grow">
          <h2>Tiến độ <span class="muted small" id="status"></span></h2>
          <div class="steps" id="steps"></div>
          <div id="final"></div>
        </section>
      </div>
    </div>
  </div>

</main>
<input type="file" id="picker" accept="image/png,image/jpeg,image/webp" hidden>
<input type="file" id="videoPicker" accept="video/mp4,video/quicktime,video/webm" hidden>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}) => Object.assign(document.createElement(tag), props);
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }
// The page is served by src/server.mjs.
window.addEventListener("error", (e) => fetch("/api/client-error", { method: "POST", body: JSON.stringify({ message: e.message, stack: e.error?.stack || "" }) }).catch(() => {}));

// This page only collects the job and follows the run; the work is src/run-video.ps1, started by src/server.mjs, whose
// @@EVENT lines this page polls. The run films the product the way the sample video (video mẫu) is filmed.
const fileUrl = (path) => `/file?path=${encodeURIComponent(path)}`;
const KEY = "product-video:make:v1";
let DATA = { settings: { resolutions: ["720p"], grokSeconds: [6, 10, 15], maxSeconds: 60, minutesPerPart: 1.5 } };
const make = Object.assign({ photo: "", model: "", name: "", reference: "", target: "", resolution: "720p" }, store.get(KEY, {}));
const run = { since: 0, running: false, steps: {}, final: null, folder: "", summary: null, fatal: "", warnings: [], frames: 0, parts: 0 };
const persist = () => store.set(KEY, make);

const BOXES = [["photoBox", "photo", "Ảnh sản phẩm", "Bấm, kéo ảnh vào, hoặc rê chuột vào đây rồi Ctrl+V"], ["modelBox", "model", "Người mẫu (tuỳ chọn)", "Thay người trong video mẫu (nếu có). Bấm, kéo ảnh vào hoặc Ctrl+V"]];
// Each box also picks from its own part of the library (product-video-sources): products, models or videos.
const LIBRARY_KIND = { photo: "products", model: "models", reference: "videos" };
const libraryButton = (key, title) => {
  const lib = el("button", { className: "btn lib", type: "button", textContent: "Từ kho" });
  lib.onclick = (e) => { e.stopPropagation(); pickFromLibrary(key, title); };
  return lib;
};
const clearButton = (key) => {
  const x = el("button", { className: "btn x", type: "button", textContent: "×", title: "Bỏ" });
  x.onclick = (e) => { e.stopPropagation(); make[key] = ""; persist(); render(); };
  return x;
};
function renderPhotos() {
  for (const [box, key, title, hint] of BOXES) {
    const node = $(box);
    node.replaceChildren();
    if (make[key]) node.append(el("img", { src: fileUrl(make[key]), alt: title }), clearButton(key));
    else node.append(Object.assign(el("span"), { innerHTML: `<b>${title}</b>${hint}` }));
    node.append(libraryButton(key, title));
  }
}
// The sample: its length and shape come from the player, as the run will read them (src/video.ps1).
let sampleInfo = null;
function renderSample() {
  const node = $("sampleBox");
  node.replaceChildren();
  sampleInfo = null;
  if (make.reference) {
    const video = el("video", { src: fileUrl(make.reference), muted: true, loop: true, autoplay: true, playsInline: true });
    video.onloadedmetadata = () => { sampleInfo = { seconds: video.duration, width: video.videoWidth, height: video.videoHeight }; renderTotal(); };
    video.onerror = () => { sampleInfo = null; renderTotal(); };
    node.append(video, clearButton("reference"));
  } else node.append(Object.assign(el("span"), { innerHTML: "<b>Video mẫu</b>Bấm hoặc kéo video MP4 vào, hoặc chọn từ kho" }));
  node.append(libraryButton("reference", "Video mẫu"));
  renderTotal();
}
const clock = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
// An estimate before the run: the run also splits at the sample's cuts, so it may make more parts.
function renderTotal() {
  if (!make.reference) return $("total").replaceChildren();
  if (!sampleInfo) return $("total").replaceChildren(el("span", { className: "muted", textContent: "Đang đọc video mẫu…" }));
  const s = DATA.settings;
  const used = Math.min(sampleInfo.seconds, s.maxSeconds);
  const parts = Math.max(1, Math.ceil(used / s.partSeconds - 0.001));
  const r = sampleInfo.width / sampleInfo.height;
  const shape = r < 0.8 ? "dọc 9:16" : r > 1.25 ? "ngang 16:9" : "vuông 1:1";
  $("total").replaceChildren(el("b", { textContent: `Video ${clock(used)}` }), ` · ${shape} · từ ${parts} đoạn trở lên · chờ khoảng ${Math.round(parts * s.minutesPerPart + 1)} phút${sampleInfo.seconds > s.maxSeconds ? ` · chỉ lấy ${s.maxSeconds} giây đầu` : ""}`);
}
function render() { renderPhotos(); renderSample(); }

// Kho: the danh mục of this box's kind, then a click on a file downloads it (once) and fills the box.
async function pickFromLibrary(key, title) {
  const kind = LIBRARY_KIND[key];
  const isVideo = kind === "videos";
  const shade = el("div", { className: "shade" });
  shade.innerHTML = `<div class="dialog library" role="dialog"><div class="top"><b>${title} từ kho</b><select></select></div><div class="grid"></div><div class="note small muted">Đang tải danh sách…</div><div class="actions"><button class="btn" type="button">Đóng</button></div></div>`;
  document.body.append(shade);
  const [select, grid, note, close] = ["select", ".grid", ".note", ".actions .btn"].map((s) => shade.querySelector(s));
  close.onclick = () => shade.remove();
  shade.onclick = (e) => { if (e.target === shade) shade.remove(); };
  const r = await fetch(`/api/library?kind=${kind}`).then((x) => x.json()).catch(() => ({ groups: [], error: "Không kết nối được kho." }));
  const groups = [].concat(r.groups || []);
  if (!groups.length) { note.textContent = r.error || "Kho chưa có gì."; select.hidden = true; return; }
  select.replaceChildren(...groups.map((g, i) => el("option", { value: String(i), textContent: `${g.name} (${g.files.length})` })));
  const saved = store.get(`library:${kind}`, "");
  select.value = String(Math.max(0, groups.findIndex((g) => g.name === saved)));
  const show = () => {
    const group = groups[Number(select.value)];
    store.set(`library:${kind}`, group.name);
    note.textContent = group.files.length ? `Bấm vào ${isVideo ? "video" : "ảnh"} để chọn.` : "Danh mục này chưa có gì.";
    grid.replaceChildren(...group.files.map((f) => {
      const src = f.local ? fileUrl(f.local) : f.url;
      const item = isVideo ? el("video", { src: `${src}#t=0.5`, muted: true, preload: "metadata", title: f.name }) : el("img", { src, alt: f.name, title: f.name, loading: "lazy", decoding: "async" });
      if (isVideo) { item.onmouseenter = () => item.play().catch(() => {}); item.onmouseleave = () => item.pause(); }
      item.onclick = async () => {
        note.textContent = "Đang tải…";
        const res = await fetch("/api/library/pick", { method: "POST", body: JSON.stringify({ kind, group: group.name, name: f.name }) }).catch(() => null);
        const body = res && (await res.json().catch(() => ({})));
        if (!res?.ok) { note.textContent = body?.error || "Chưa tải được."; return; }
        make[key] = body.path; persist(); render(); shade.remove();
      };
      return item;
    }));
  };
  select.onchange = show;
  show();
}
let pickFor = "photo";
async function upload(file, key) {
  const video = key === "reference";
  if (!file || !(video ? /^video\/(mp4|quicktime|webm)$/ : /^image\/(png|jpeg|webp)$/).test(file.type)) return toast(video ? "Chọn video MP4, MOV hoặc WebM" : "Chọn ảnh PNG, JPEG hoặc WebP");
  if (video) toast("Đang tải video lên…");
  const r = await fetch(`/api/upload?name=${encodeURIComponent(file.name || (video ? "mau.mp4" : "anh.png"))}`, { method: "POST", body: file }).catch(() => null);
  const body = r && (await r.json().catch(() => ({})));
  if (!r?.ok) return toast(body?.error || "Không tải lên được");
  make[key] = body.path; persist(); render();
}
for (const [box, key] of [...BOXES, ["sampleBox", "reference"]]) {
  const node = $(box);
  node.onclick = () => { pickFor = key; const p = key === "reference" ? $("videoPicker") : $("picker"); p.value = ""; p.click(); };
  node.addEventListener("dragover", (e) => { e.preventDefault(); node.classList.add("dropping"); });
  node.addEventListener("dragleave", () => node.classList.remove("dropping"));
  node.addEventListener("drop", (e) => { e.preventDefault(); node.classList.remove("dropping"); upload(e.dataTransfer.files[0], key); });
}
$("picker").onchange = (e) => upload(e.target.files[0], pickFor);
$("videoPicker").onchange = (e) => upload(e.target.files[0], "reference");
// Ctrl+V: into the photo box under the mouse or focused; elsewhere, into the product box while it is empty, else the model's.
// A screenshot comes as a file, an image copied from a page as an item.
let pasteInto = "";
for (const [box, key] of BOXES) {
  const node = $(box);
  node.addEventListener("mouseenter", () => (pasteInto = key));
  node.addEventListener("mouseleave", () => { if (document.activeElement !== node) pasteInto = ""; });
  node.addEventListener("focus", () => (pasteInto = key));
  node.addEventListener("blur", () => (pasteInto = ""));
}
document.addEventListener("paste", (e) => {
  if (e.target.closest?.("input, textarea")) return;
  const f = [...e.clipboardData.items].find((i) => i.kind === "file" && i.type.startsWith("image/"))?.getAsFile();
  if (!f) return;
  e.preventDefault();
  upload(f, pasteInto || (make.photo ? "model" : "photo"));
});

function renderSettings() {
  $("resolution").replaceChildren(...DATA.settings.resolutions.map((v) => {
    const b = el("button", { type: "button", textContent: v });
    b.setAttribute("aria-pressed", v === make.resolution);
    b.onclick = () => { make.resolution = v; persist(); renderSettings(); };
    return b;
  }));
}
$("name").value = make.name;
$("name").oninput = (e) => { make.name = e.target.value; persist(); };
$("target").value = make.target;
$("target").oninput = (e) => { make.target = e.target.value; persist(); };

// The run, as the events say.
function onEvent(e) {
  if (e.kind === "start") Object.assign(run, { folder: e.folder, frames: e.frames, parts: e.parts });
  else if (e.kind === "frame") run.steps[`f${e.index}`] = e;
  else if (e.kind === "clip") run.steps[`c${e.index}`] = e;
  else if (e.kind === "final") run.final = e;
  else if (e.kind === "warning") run.warnings.push(e.message);
  else if (e.kind === "done") run.summary = e;
  else if (e.kind === "fatal") run.fatal = e.message;
}
function renderRun() {
  $("run").disabled = run.running; $("stop").disabled = !run.running; $("open").disabled = !run.folder;
  const rows = [];
  const line = (key, title, frame) => {
    const e = run.steps[key];
    const row = el("div", { className: "step" });
    const shown = frame && (e?.file || e?.sample);
    const thumb = shown ? el("img", { className: "thumb", src: fileUrl(shown), title: e.file ? "" : "Khung của video mẫu" }) : el("div", { className: "thumb" });
    const text = el("div");
    const state = el("span", { className: e ? (e.ok ? "ok" : "bad") : "muted", textContent: !e ? (run.running ? "chờ" : "") : e.ok ? "xong" : "lỗi" });
    text.append(el("div", { textContent: `${title}${e?.label ? ": " + e.label : ""} ` }));
    text.firstChild.append(state);
    if (e?.message) text.append(el("div", { className: "msg", textContent: e.message, title: e.message }));
    row.append(thumb, text);
    rows.push(row);
  };
  if (run.running || run.summary || run.fatal) {
    for (let i = 0; i < run.frames; i++) line(`f${i}`, `Khung ${i + 1}`, true);
    for (let i = 1; i <= run.parts; i++) line(`c${i}`, `Video đoạn ${i}`, false);
    if (run.running && !run.frames) rows.push(el("div", { className: "muted", textContent: "Đang tách cảnh video mẫu…" }));
  }
  for (const w of run.warnings) rows.push(el("div", { className: "warn small", textContent: w }));
  if (run.fatal) rows.push(el("div", { className: "bad", textContent: run.fatal }));
  if (run.summary?.message) rows.push(el("div", { className: "warn", textContent: run.summary.message }));
  $("steps").replaceChildren(...rows);
  const done = Object.values(run.steps).filter((s) => s.ok).length;
  $("status").textContent = run.running ? (run.frames ? `đang chạy · ${done}/${run.frames + run.parts} bước` : "đang chạy") : run.summary ? (run.summary.ok ? "xong" : "chưa ra video") : "";
  const final = $("final");
  if (run.final && final.dataset.file !== run.final.file) {
    final.dataset.file = run.final.file;
    final.replaceChildren(el("div", { className: "ok", textContent: `Video ${run.final.seconds}s, ${run.final.width}×${run.final.height}` }), el("video", { src: fileUrl(run.final.file), controls: true, playsInline: true }));
  } else if (!run.final) { final.dataset.file = ""; final.replaceChildren(); }
}
let polling = false;
async function poll() {
  if (polling) return;
  polling = true;
  try {
    for (;;) {
      const r = await fetch(`/api/run?since=${run.since}`).then((x) => x.json());
      r.events.forEach(onEvent);
      run.since = r.next; run.running = r.running; run.folder = r.folder || run.folder;
      renderRun();
      if (!r.running) break;
      await new Promise((done) => setTimeout(done, 1500));
    }
  } catch { run.running = false; renderRun(); }
  polling = false;
}
$("run").onclick = async () => {
  if (!make.photo) return toast("Thêm ảnh sản phẩm");
  if (!make.name.trim()) { $("name").focus(); return toast("Điền tên sản phẩm"); }
  if (!make.reference) return toast("Chọn video mẫu");
  const job = { product: make.name.trim(), photo: make.photo, model: make.model, reference: make.reference, target: make.target.trim(), resolution: make.resolution };
  Object.assign(run, { since: 0, steps: {}, final: null, folder: "", summary: null, fatal: "", warnings: [], frames: 0, parts: 0 });
  const r = await fetch("/api/run", { method: "POST", body: JSON.stringify(job) }).catch(() => null);
  const body = r && (await r.json().catch(() => ({})));
  if (!r?.ok) return toast(body?.error || "Không bắt đầu được. Đóng và mở lại Product Video.");
  run.running = true; renderRun(); poll();
};
$("stop").onclick = async () => { await fetch("/api/stop", { method: "POST" }).catch(() => {}); toast("Đang dừng…"); };
$("open").onclick = () => fetch("/api/open-folder", { method: "POST" }).catch(() => {});

fetch("/api/data").then((r) => r.json()).then((data) => {
  DATA = data;
  if (!data.settings.resolutions.includes(make.resolution)) make.resolution = data.settings.defaultResolution;
  render(); renderSettings(); renderRun(); poll();
}, () => toast("Không đọc được dữ liệu. Đóng và mở lại Product Video."));

</script>
</body>
</html>
