<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Video</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/core/assets/tool.css">
<script src="/core/assets/hub.js" defer></script>
<style>
/* Fits the window: the sample video, photos and settings on the left, the run (frames, clips, the video) on the right. */
body { height: 100vh; overflow: hidden; }
main { height: 100%; display: flex; flex-direction: column; }
.layout { flex: 1; min-height: 0; grid-template-columns: minmax(0, 1fr) 400px; }
.page { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.col { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.col > .group { flex: none; }
.col > .grow, .page > .grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }
/* Tạo video */
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.photo { position: relative; height: 150px; background: #fff; border: 1px dashed var(--line); display: grid; place-content: center; text-align: center; color: var(--muted); cursor: pointer; overflow: hidden; padding: 8px; }
.photo:hover, .photo.dropping { background: var(--hover); border-color: var(--accent); }
.photo img, .photo video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }
.photo video { background: #000; }
.photo .x { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; padding: 0; z-index: 1; }
.photo b { color: var(--ink); font-weight: 400; display: block; margin-bottom: 4px; }
.photo .lib { position: absolute; left: 6px; bottom: 6px; height: 26px; padding: 0 10px; z-index: 1; }
#sampleBox { flex: 1; min-height: 160px; height: auto; }
/* Nhạc nền: one row, the track playable in place, Từ kho and × at the end. */
.music { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 8px; background: #fff; border: 1px dashed var(--line); color: var(--muted); cursor: pointer; }
.music:hover, .music.dropping { background: var(--hover); border-color: var(--accent); }
.music audio { flex: 1; min-width: 0; height: 32px; }
.music .hint { flex: 1; }
.music .btn { height: 28px; padding: 0 10px; }
.library .grid .track { width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px; border: 1px solid var(--line); background: #fff; }
.library .grid .track span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.library .grid .track audio { width: 260px; height: 32px; }
/* Kho: a danh mục, then its photos or videos as a grid of thumbnails. */
.dialog.library { width: min(760px, calc(100vw - 32px)); }
.library .top { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.library .grid { height: 380px; overflow-y: auto; background: #fff; border: 1px solid var(--line); padding: 6px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; }
.library .grid img, .library .grid video { width: 104px; height: 104px; object-fit: contain; background: var(--control); border: 2px solid transparent; cursor: pointer; }
.library .grid video { width: 140px; height: 180px; background: #000; }
.library .grid img:hover, .library .grid video:hover { border-color: var(--accent); }
.library .note { margin-top: 8px; min-height: 18px; }
.settings { display: flex; gap: 16px; flex-wrap: wrap; align-items: end; }
.settings label { margin-top: 0; }
.total { margin-top: 10px; font-size: 14px; }
/* Hiệu ứng không dùng: every transition as a toggle; a struck-through one is never used. */
.shade { z-index: 20; } /* above the photo boxes' own buttons */
/* Hiệu ứng, Góc máy: every transition or angle as a card with its sample; its Dùng checkbox switches it on or off. */
.cards-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.card[hidden], .cards h3[hidden] { display: none; }
.card .use { display: flex; align-items: center; gap: 6px; margin: 4px 8px 8px; font-size: 13px; color: #006400; cursor: pointer; }
.card .use input { margin: 0; width: 16px; height: 16px; cursor: pointer; }
.card.off .use { color: rgb(176, 0, 0); }
.cards { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; align-content: start; padding: 2px; }
.cards h3 { grid-column: 1 / -1; margin: 8px 0 0; font-size: 14px; font-weight: 400; color: var(--muted); }
.card { background: #fff; border: 1px solid var(--line); display: flex; flex-direction: column; text-align: left; padding: 0; font: inherit; color: inherit; }
.card:hover { border-color: var(--accent); }
.card video, .card img, .card .noimg { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: var(--control); display: block; }
.card .name { padding: 6px 8px 0; }
.card.off { border-color: rgb(176, 0, 0); }
.card.off video, .card.off img { filter: grayscale(.9); }
.card.off .name { text-decoration: line-through; }
.total b { color: var(--accent-dark); font-weight: 600; }
/* The run */
.steps { flex: 1; min-height: 0; overflow-y: auto; background: #fff; border: 1px solid #000; padding: 8px; display: grid; gap: 6px; align-content: start; }
.step { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; align-items: center; min-height: 44px; }
.step .thumb { width: 56px; height: 42px; object-fit: cover; background: var(--control); display: block; }
.step .msg { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ok { color: #006400; } .bad { color: rgb(176, 0, 0); } .warn { color: rgb(176, 96, 0); }
#final video { width: 100%; max-height: 260px; background: #000; display: block; margin-top: 8px; }
.buttons { display: flex; gap: 8px; }
.buttons .btn { flex: 1; }
/* Phân tích video mẫu: the sample on the left, its shots (frame, time, camera move, angle) on the right. */
header .seg { margin-left: 16px; }
#analyze .layout { grid-template-columns: 400px minmax(0, 1fr); }
#anBox { flex: 1; min-height: 200px; height: auto; }
.an-tools { display: flex; gap: 8px; margin-top: 10px; }
.an-tools .btn { flex: 1; }
.shots { flex: 1; min-height: 0; overflow-y: auto; background: #fff; border: 1px solid #000; padding: 8px; display: grid; gap: 8px; align-content: start; }
.shot { display: grid; grid-template-columns: 160px minmax(0, 1fr) 220px; gap: 12px; align-items: start; border: 1px solid var(--line); padding: 8px; }
.shot img, .shot .noimg { width: 160px; height: 100px; object-fit: contain; background: var(--control); display: block; cursor: pointer; border: 1px solid transparent; }
.shot img:hover { border-color: var(--accent); }
.shot .when { color: var(--ink); }
.shot .move { margin-top: 4px; }
.shot .phases { margin-top: 4px; font-size: 12px; color: var(--muted); }
.shot select { margin-top: 0; }
.shot .desc { margin-top: 4px; font-size: 12px; color: var(--muted); }
.an-save { display: flex; gap: 8px; align-items: end; margin-top: 10px; }
.an-save > div { flex: 1; }
.an-save label { margin-top: 0; }
</style>
</head>
<body data-fit="1100x760">
<main>
  <header><h1>Product Video</h1><div class="seg" id="tabs"><button type="button" data-page="make">Tạo video</button><button type="button" data-page="analyze">Phân tích video mẫu</button><button type="button" data-page="fx">Hiệu ứng</button><button type="button" data-page="angles">Góc máy</button></div></header>

  <div class="page" id="make">
    <div class="layout">
      <div class="col">
        <section class="group">
          <h2>Ảnh</h2>
          <div class="photos">
            <div class="photo" id="photoBox" tabindex="0"></div>
            <div class="photo" id="modelBox" tabindex="0"></div>
          </div>
          <label for="name">Tên sản phẩm</label>
          <input id="name" placeholder="Kệ đĩa than gỗ óc chó dáng cong">
        </section>
        <section class="group grow">
          <h2>Video mẫu (tuỳ chọn): học cách làm, không lấy hình</h2>
          <div class="photo" id="sampleBox" tabindex="0"></div>
          <label>Nhạc nền (tuỳ chọn)</label>
          <div class="music" id="musicBox" tabindex="0"></div>
          <div class="settings" style="margin-top:10px">
            <div><label>Độ dài video</label><div class="seg" id="length"></div></div>
            <div><label>Khổ</label><div class="seg" id="aspect"></div></div>
            <div><label>Phụ đề tiếng Anh</label><div class="seg" id="captions"></div></div>
          </div>
          <div id="total" class="total"></div>
        </section>
      </div>
      <div class="col">
        <section class="group actions-col">
          <h2>Thao tác</h2>
          <div class="buttons"><button class="btn primary" id="run" type="button">Tạo video</button><button class="btn" id="stop" type="button" disabled>Dừng</button><button class="btn" id="open" type="button" disabled>Mở thư mục</button></div>
          <div class="note small" style="margin-top:8px">Cần ảnh sản phẩm. Video mẫu, người mẫu, nhạc là tuỳ chọn.</div>
        </section>
        <section class="group grow">
          <h2>Tiến độ <span class="muted small" id="status"></span></h2>
          <div class="steps" id="steps"></div>
          <div id="final"></div>
        </section>
      </div>
    </div>
  </div>

  <div class="page" id="analyze" hidden>
    <div class="layout">
      <div class="col">
        <section class="group grow">
          <h2>Video mẫu cần phân tích</h2>
          <label for="anList">Video đã có trong kho (workspace/library)</label>
          <select id="anList"></select>
          <div class="photo" id="anBox" tabindex="0" style="margin-top:10px"></div>
          <div class="an-tools"><button class="btn primary" id="anRun" type="button">Phân tích</button><button class="btn" id="anUse" type="button" disabled>Dùng để tạo video</button></div>
          <div class="note small" style="margin-top:8px">Chọn video, bấm Phân tích. Sửa góc từng cảnh nếu cần rồi Lưu kế hoạch.</div>
        </section>
      </div>
      <div class="col">
        <section class="group grow">
          <h2>Các cảnh <span class="muted small" id="anStatus"></span></h2>
          <div class="shots" id="anShots"></div>
          <div class="an-save">
            <div><label for="anNote">Ghi chú kế hoạch (tuỳ chọn)</label><input id="anNote" placeholder="Toàn cảnh chính diện -> cận mép gỗ -> toàn cảnh nghiêng"></div>
            <button class="btn primary" id="anSave" type="button" disabled>Lưu kế hoạch</button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div class="page" id="fx" hidden>
    <section class="group grow">
      <h2>Hiệu ứng chuyển cảnh <span class="muted small" id="fxStatus"></span></h2>
      <div class="cards-top"><div class="seg" id="fxFilter"></div></div>
      <div class="cards" id="fxCards"></div>
    </section>
  </div>

  <div class="page" id="angles" hidden>
    <section class="group grow">
      <h2>Góc máy <span class="muted small" id="angleStatus"></span></h2>
      <div class="cards-top"><div class="seg" id="anglesFilter"></div></div>
      <div class="cards" id="angleCards"></div>
    </section>
  </div>

</main>
<input type="file" id="picker" accept="image/png,image/jpeg,image/webp" hidden>
<input type="file" id="videoPicker" accept="video/mp4,video/quicktime,video/webm" hidden>
<input type="file" id="audioPicker" accept="audio/mpeg,audio/mp4,audio/x-m4a,audio/aac,audio/wav,.mp3,.m4a,.aac,.wav" hidden>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}) => Object.assign(document.createElement(tag), props);
// What the window remembers (page, filters, the job, the library group, the video analysed): workspace/giao-dien.json
// through /api/ui-state (src/server.mjs), read once at start; new source starts clean.
const UI = {};
let uiSave = 0;
const store = {
  get: (k, d) => UI[k] ?? d,
  set(k, v) { UI[k] = v; clearTimeout(uiSave); uiSave = setTimeout(() => fetch("/api/ui-state", { method: "POST", body: JSON.stringify(UI) }).catch(() => {}), 300); },
};
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }
// The page is served by src/server.mjs.
window.addEventListener("error", (e) => fetch("/api/client-error", { method: "POST", body: JSON.stringify({ message: e.message, stack: e.error?.stack || "" }) }).catch(() => {}));

// This page only collects the job and follows the run; the work is src/run-video.ps1, started by src/server.mjs, whose
// @@EVENT lines this page polls. The sample video (video mẫu, optional) only lends how it is made.
const fileUrl = (path) => `/file?path=${encodeURIComponent(path)}`;
const KEY = "product-video:make:v1";
let DATA = { settings: { lengths: [30], defaultLength: 30, aspects: ["auto"], defaultResolution: "720p", shotSeconds: 2.6, maxSeconds: 60, minutesPerShot: 1.2, minutesPerFrameRound: 2, codexParallel: 4 } };
const make = { photo: "", model: "", name: "", reference: "", length: 0, aspect: "auto", captions: null };
const run = { since: 0, running: false, steps: {}, final: null, folder: "", summary: null, fatal: "", warnings: [], frames: 0, shots: 0 };
const persist = () => store.set(KEY, make);

const BOXES = [["photoBox", "photo", "Ảnh sản phẩm", "Bấm, kéo ảnh vào, hoặc rê chuột vào đây rồi Ctrl+V"], ["modelBox", "model", "Người mẫu (tuỳ chọn)", "Giới thiệu sản phẩm ở cảnh đầu. Bấm, kéo ảnh vào hoặc Ctrl+V"]];
// Each box also picks from its own part of the library (product-video-sources): products, models or videos.
const LIBRARY_KIND = { photo: "products", model: "models", reference: "videos", music: "music" };
const libraryButton = (key, title) => {
  const lib = el("button", { className: "btn lib", type: "button", textContent: "Từ kho" });
  lib.onclick = (e) => { e.stopPropagation(); pickFromLibrary(key, title); };
  return lib;
};
const clearButton = (key) => {
  const x = el("button", { className: "btn x", type: "button", textContent: "×", title: "Bỏ" });
  x.onclick = (e) => { e.stopPropagation(); make[key] = ""; persist(); render(); };
  return x;
};
function renderPhotos() {
  for (const [box, key, title, hint] of BOXES) {
    const node = $(box);
    node.replaceChildren();
    if (make[key]) node.append(el("img", { src: fileUrl(make[key]), alt: title }), clearButton(key));
    else node.append(Object.assign(el("span"), { innerHTML: `<b>${title}</b>${hint}` }));
    node.append(libraryButton(key, title));
  }
}
// The sample: its length and shape come from the player, as the run will read them (src/plan.ps1).
let sampleInfo = null;
function renderSample() {
  const node = $("sampleBox");
  node.replaceChildren();
  sampleInfo = null;
  if (make.reference) {
    const video = el("video", { src: fileUrl(make.reference), muted: true, loop: true, autoplay: true, playsInline: true });
    video.onloadedmetadata = () => { sampleInfo = { seconds: video.duration, width: video.videoWidth, height: video.videoHeight }; renderTotal(); };
    video.onerror = () => { sampleInfo = null; renderTotal(); };
    node.append(video, clearButton("reference"));
  } else node.append(Object.assign(el("span"), { innerHTML: "<b>Video mẫu (tuỳ chọn)</b>Bấm hoặc kéo video MP4 vào, hoặc chọn từ kho. Không có thì dùng chuỗi cảnh mặc định" }));
  node.append(libraryButton("reference", "Video mẫu"));
  renderTotal();
}
const clock = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
// An estimate before the run (src/plan.ps1 makes the real plan): shots of at most shotSeconds, a round of Codex frames
// per codexParallel angles, a Grok clip per shot.
const videoLength = () => make.length || (make.reference ? Math.min(sampleInfo?.seconds || 0, DATA.settings.maxSeconds) : DATA.settings.defaultLength);
function renderTotal() {
  if (make.reference && !sampleInfo) return $("total").replaceChildren(el("span", { className: "muted", textContent: "Đang đọc video mẫu…" }));
  const s = DATA.settings;
  const used = videoLength();
  const shots = Math.max(1, Math.ceil(used / s.shotSeconds - 0.001));
  const frames = Math.min(shots, 9) + (make.model ? 1 : 0);
  const minutes = Math.round(shots * s.minutesPerShot + Math.ceil(frames / s.codexParallel) * s.minutesPerFrameRound);
  const r = sampleInfo ? sampleInfo.width / sampleInfo.height : 0;
  const aspect = make.aspect !== "auto" ? make.aspect : !make.reference ? "2:3" : r < 0.8 ? "2:3" : r > 1.25 ? "3:2" : "1:1";
  const note = make.reference && !make.length && sampleInfo.seconds > s.maxSeconds ? ` · chỉ lấy ${s.maxSeconds} giây đầu` : "";
  $("total").replaceChildren(el("b", { textContent: `Video ${clock(used)}` }), ` · khổ ${aspect} · khoảng ${shots} cảnh · chờ khoảng ${minutes} phút${note}`);
}
// Nhạc nền: a track from the library (product-video-sources/music) or uploaded; the run lays it under the whole video.
function renderMusic() {
  const node = $("musicBox");
  node.replaceChildren();
  if (make.music) {
    const audio = el("audio", { src: fileUrl(make.music), controls: true, preload: "metadata" });
    audio.onclick = (e) => e.stopPropagation();
    node.append(audio, clearButton("music"));
  } else node.append(el("span", { className: "hint", textContent: "Bấm hoặc kéo file MP3, M4A, WAV vào, hoặc chọn từ kho. Không có thì video không có tiếng" }));
  node.append(libraryButton("music", "Nhạc nền"));
}
function render() { renderPhotos(); renderSample(); renderMusic(); renderSettings(); }

// Kho: the danh mục of this box's kind, then a click on a file downloads it (once) and fills the box.
async function pickFromLibrary(key, title) {
  const kind = LIBRARY_KIND[key];
  const isVideo = kind === "videos", isMusic = kind === "music";
  const shade = el("div", { className: "shade" });
  shade.innerHTML = `<div class="dialog library" role="dialog"><div class="top"><b>${title} từ kho</b><select></select></div><div class="grid"></div><div class="note small muted">Đang tải danh sách…</div><div class="actions"><button class="btn" type="button">Đóng</button></div></div>`;
  document.body.append(shade);
  const [select, grid, note, close] = ["select", ".grid", ".note", ".actions .btn"].map((s) => shade.querySelector(s));
  close.onclick = () => shade.remove();
  shade.onclick = (e) => { if (e.target === shade) shade.remove(); };
  const r = await fetch(`/api/library?kind=${kind}`).then((x) => x.json()).catch(() => ({ groups: [], error: "Không kết nối được kho." }));
  const groups = [].concat(r.groups || []);
  if (!groups.length) { note.textContent = r.error || "Kho chưa có gì."; select.hidden = true; return; }
  select.replaceChildren(...groups.map((g, i) => el("option", { value: String(i), textContent: `${g.name} (${g.files.length})` })));
  const saved = store.get(`library:${kind}`, "");
  select.value = String(Math.max(0, groups.findIndex((g) => g.name === saved)));
  const show = () => {
    const group = groups[Number(select.value)];
    store.set(`library:${kind}`, group.name);
    note.textContent = group.files.length ? (isMusic ? "Nghe thử rồi bấm Chọn." : `Bấm vào ${isVideo ? "video" : "ảnh"} để chọn.`) : "Danh mục này chưa có gì.";
    grid.replaceChildren(...group.files.map((f) => {
      const src = f.local ? fileUrl(f.local) : f.url;
      let item, pick;
      if (isMusic) {
        pick = el("button", { className: "btn", type: "button", textContent: "Chọn" });
        item = el("div", { className: "track" });
        item.append(el("span", { textContent: f.name, title: f.name }), el("audio", { src, controls: true, preload: "none" }), pick);
      } else {
        item = pick = isVideo ? el("video", { src: `${src}#t=0.5`, muted: true, preload: "metadata", title: f.name }) : el("img", { src, alt: f.name, title: f.name, loading: "lazy", decoding: "async" });
        if (isVideo) { item.onmouseenter = () => item.play().catch(() => {}); item.onmouseleave = () => item.pause(); }
      }
      pick.onclick = async () => {
        note.textContent = "Đang tải…";
        const res = await fetch("/api/library/pick", { method: "POST", body: JSON.stringify({ kind, group: group.name, name: f.name }) }).catch(() => null);
        const body = res && (await res.json().catch(() => ({})));
        if (!res?.ok) { note.textContent = body?.error || "Chưa tải được."; return; }
        make[key] = body.path; persist(); render(); shade.remove();
      };
      return item;
    }));
  };
  select.onchange = show;
  show();
}
let pickFor = "photo";
// What each box takes: the file types, the message when it is not one, and a name for a file that has none.
const UPLOAD = {
  reference: [/^video\/(mp4|quicktime|webm)$/, "Chọn video MP4, MOV hoặc WebM", "mau.mp4"],
  music: [/^audio\/(mpeg|mp3|mp4|x-m4a|aac|wav|x-wav|wave)$/, "Chọn nhạc MP3, M4A, AAC hoặc WAV", "nhac.mp3"],
  image: [/^image\/(png|jpeg|webp)$/, "Chọn ảnh PNG, JPEG hoặc WebP", "anh.png"],
};
async function upload(file, key) {
  const [types, wrong, fallback] = UPLOAD[key] || UPLOAD.image;
  if (!file || !types.test(file.type)) return toast(wrong);
  if (key !== "photo" && key !== "model") toast("Đang tải lên…");
  const r = await fetch(`/api/upload?name=${encodeURIComponent(file.name || fallback)}`, { method: "POST", body: file }).catch(() => null);
  const body = r && (await r.json().catch(() => ({})));
  if (!r?.ok) return toast(body?.error || "Không tải lên được");
  make[key] = body.path; persist(); render();
}
const PICKER = { reference: "videoPicker", music: "audioPicker" };
for (const [box, key] of [...BOXES, ["sampleBox", "reference"], ["musicBox", "music"]]) {
  const node = $(box);
  node.onclick = () => { pickFor = key; const p = $(PICKER[key] || "picker"); p.value = ""; p.click(); };
  node.addEventListener("dragover", (e) => { e.preventDefault(); node.classList.add("dropping"); });
  node.addEventListener("dragleave", () => node.classList.remove("dropping"));
  node.addEventListener("drop", (e) => { e.preventDefault(); node.classList.remove("dropping"); upload(e.dataTransfer.files[0], key); });
}
$("picker").onchange = (e) => upload(e.target.files[0], pickFor);
$("videoPicker").onchange = (e) => upload(e.target.files[0], "reference");
$("audioPicker").onchange = (e) => upload(e.target.files[0], "music");
// Ctrl+V: into the photo box under the mouse or focused; elsewhere, into the product box while it is empty, else the model's.
// A screenshot comes as a file, an image copied from a page as an item.
let pasteInto = "";
for (const [box, key] of BOXES) {
  const node = $(box);
  node.addEventListener("mouseenter", () => (pasteInto = key));
  node.addEventListener("mouseleave", () => { if (document.activeElement !== node) pasteInto = ""; });
  node.addEventListener("focus", () => (pasteInto = key));
  node.addEventListener("blur", () => (pasteInto = ""));
}
document.addEventListener("paste", (e) => {
  if (e.target.closest?.("input, textarea")) return;
  const f = [...e.clipboardData.items].find((i) => i.kind === "file" && i.type.startsWith("image/"))?.getAsFile();
  if (!f) return;
  e.preventDefault();
  upload(f, pasteInto || (make.photo ? "model" : "photo"));
});

const ASPECT_LABEL = { auto: "Tự động", "2:3": "Dọc 2:3", "1:1": "Vuông", "3:2": "Ngang 3:2" };
function renderSettings() {
  const seg = (id, values, current, key, fmt) => $(id).replaceChildren(...values.map((v) => {
    const b = el("button", { type: "button", textContent: fmt(v) });
    b.setAttribute("aria-pressed", v === current);
    b.onclick = () => { make[key] = v; persist(); renderSettings(); renderTotal(); };
    return b;
  }));
  // "Như mẫu" only with a sample; without one, 0 stands for defaultLength.
  const lengths = make.reference ? [0, ...DATA.settings.lengths] : DATA.settings.lengths;
  seg("length", lengths, make.reference ? make.length : make.length || DATA.settings.defaultLength, "length", (v) => (v ? `${v}s` : "Như mẫu"));
  seg("aspect", DATA.settings.aspects, make.aspect, "aspect", (v) => ASPECT_LABEL[v] || v);
  // Captions: English lines Codex writes from the shots and the brand (src/script.ps1), burnt in; null = the default.
  seg("captions", [true, false], make.captions ?? DATA.settings.captions === true, "captions", (v) => (v ? "Có" : "Không"));
}
// Hiệu ứng, Góc máy: every transition (a sample clip) and angle (a sample frame) from product-video-sources/samples, as a
// card; a click switches it on or off and saves the list at once (server.mjs: workspace/lua-chon.json, which the run
// reads through src/plan.ps1).
const FX_LABEL = { fade: "Hoà hình", dissolve: "Lộ dần", hblur: "Nhoè ngang", fadeblack: "Qua đen", fadewhite: "Nháy trắng", fadegrays: "Qua xám", fadefast: "Hoà nhanh", fadeslow: "Hoà chậm", zoomin: "Phóng vào", radial: "Quét tròn", distance: "Tan biến", pixelize: "Vỡ điểm ảnh", circleopen: "Mở tròn", circleclose: "Đóng tròn", circlecrop: "Khung tròn", rectcrop: "Khung vuông", vertopen: "Mở dọc", vertclose: "Đóng dọc", horzopen: "Mở ngang", horzclose: "Đóng ngang", squeezeh: "Ép ngang", squeezev: "Ép dọc", diagtl: "Chéo từ trên trái", diagtr: "Chéo từ trên phải", diagbl: "Chéo từ dưới trái", diagbr: "Chéo từ dưới phải", hlslice: "Lát ngang sang trái", hrslice: "Lát ngang sang phải", vuslice: "Lát dọc lên", vdslice: "Lát dọc xuống", wipetl: "Gạt góc trên trái", wipetr: "Gạt góc trên phải", wipebl: "Gạt góc dưới trái", wipebr: "Gạt góc dưới phải",smoothleft: "Lướt trái", smoothright: "Lướt phải", smoothup: "Lướt lên", smoothdown: "Lướt xuống", slideleft: "Trượt trái", slideright: "Trượt phải", slideup: "Trượt lên", slidedown: "Trượt xuống", wipeleft: "Gạt trái", wiperight: "Gạt phải", wipeup: "Gạt lên", wipedown: "Gạt xuống" };
// One switch is sent (server.mjs applies it to the list as saved now); the list it answers with redraws every card of
// that list, so a page open for long shows what is really saved.
const cardShows = { bannedTransitions: [], bannedAngles: [] };
async function saveChoice(list, id, off) {
  const r = await fetch("/api/choices", { method: "POST", body: JSON.stringify({ list, id, off }) }).catch(() => null);
  const body = r && (await r.json().catch(() => ({})));
  if (!r?.ok) { toast(body?.error || "Chưa lưu được."); return false; }
  DATA.settings[list] = body[list];
  cardShows[list].forEach((show) => show());
  return true;
}
// One card: the sample, its name and a Dùng checkbox. Only the checkbox switches it (a click on the picture used to
// switch it too, easy to do by mistake while watching the sample; 05/11/2026). The description is the tooltip.
function choiceCard(list, id, media, name, sub, onSaved) {
  const card = el("div", { className: "card", title: sub || name });
  const box = el("input", { type: "checkbox" });
  const show = () => { const off = (DATA.settings[list] || []).includes(id); card.classList.toggle("off", off); box.checked = !off; };
  const use = el("label", { className: "use" });
  use.append(box, " Dùng");
  card.append(media, el("div", { className: "name", textContent: name }), use);
  box.onchange = async () => { box.disabled = true; if (await saveChoice(list, id, !box.checked)) onSaved(); else show(); box.disabled = false; applyFilter(); };
  cardShows[list].push(show);
  show();
  return card;
}
// Lọc: Tất cả / Đang dùng / Không dùng, one row above each list of cards.
const FILTERS = [["all", "Tất cả"], ["on", "Đang dùng"], ["off", "Không dùng"]];
const filterOf = { fx: "all", angles: "all" };
const filterDraw = {};
function applyFilter() {
  for (const [page, cards] of [["fx", "fxCards"], ["angles", "angleCards"]]) {
    const f = filterOf[page];
    for (const c of $(cards).querySelectorAll(".card")) c.hidden = f !== "all" && c.classList.contains("off") !== (f === "off");
    for (const h of $(cards).querySelectorAll("h3")) {
      let n = h.nextElementSibling, any = false;
      for (; n && n.tagName !== "H3"; n = n.nextElementSibling) any ||= !n.hidden;
      h.hidden = !any;
    }
  }
}
for (const page of ["fx", "angles"]) {
  const seg = $(`${page}Filter`);
  const draw = () => seg.replaceChildren(...FILTERS.map(([v, label]) => {
    const b = el("button", { type: "button", textContent: label });
    b.setAttribute("aria-pressed", filterOf[page] === v);
    b.onclick = () => { filterOf[page] = v; store.set(`filter:${page}`, v); draw(); applyFilter(); };
    return b;
  }));
  filterDraw[page] = draw;
  draw();
}
// The still a card shows: before the cut (samples cut from 1 s to 2 s), so the picture is sharp; any frame inside the cut
// looked blurred or washed out (05/11/2026). Hover or click plays the cut.
const FX_STILL = 0.5;
// The samples load only once their card is on screen: all 46 at once made the window drop some, which stayed blank
// (05/11/2026, Lộ dần). A load that fails or stalls is tried again, up to 3 times.
const fxSeen = new IntersectionObserver((entries) => {
  for (const { target: v, isIntersecting } of entries) {
    if (!isIntersecting || v.getAttribute("src")) continue;
    fxSeen.unobserve(v);
    let tries = 0;
    const load = () => { v.src = `${v.dataset.src}${tries ? `?r=${tries}` : ""}#t=${FX_STILL}`; v.load(); };
    const retry = () => { if (v.readyState < 2 && tries < 3) { tries++; setTimeout(load, 800 * tries); } };
    v.onerror = retry;
    v.onstalled = () => setTimeout(retry, 4000);
    load();
  }
}, { rootMargin: "200px" });
function renderFx() {
  const names = DATA.settings.transitionNames || [];
  const status = () => { $("fxStatus").textContent = `· đang dùng ${names.length - (DATA.settings.bannedTransitions || []).length}/${names.length}`; };
  $("fxCards").replaceChildren(...names.map((n) => {
    const video = el("video", { muted: true, loop: true, playsInline: true, preload: "auto" });
    video.dataset.src = `${DATA.samples}/transitions/${n}.mp4`;
    fxSeen.observe(video);
    video.onmouseenter = () => { video.currentTime = 0; video.play().catch(() => {}); };
    video.onmouseleave = () => { video.pause(); video.currentTime = FX_STILL; };
    video.onclick = () => { video.currentTime = 0; video.play().catch(() => {}); };
    return choiceCard("bannedTransitions", n, video, FX_LABEL[n] || n, n, status);
  }));
  applyFilter();
  status();
}
function renderAngles() {
  const list = DATA.angles?.list || [];
  const status = () => { $("angleStatus").textContent = `· đang dùng ${list.length - (DATA.settings.bannedAngles || []).length}/${list.length}`; };
  const cards = [];
  for (const g of DATA.angles?.groups || []) {
    cards.push(el("h3", { textContent: g.label }));
    for (const a of list.filter((x) => x.group === g.id)) {
      const img = el("img", { src: `${DATA.samples}/angles/${a.id}.jpg`, alt: a.label, loading: "lazy", decoding: "async" });
      img.onerror = () => img.replaceWith(el("div", { className: "noimg" }));
      cards.push(choiceCard("bannedAngles", a.id, img, a.label, a.description, status));
    }
  }
  $("angleCards").replaceChildren(...cards);
  applyFilter();
  status();
}
$("name").value = make.name;
$("name").oninput = (e) => { make.name = e.target.value; persist(); };

// The run, as the events say.
function onEvent(e) {
  if (e.kind === "start") Object.assign(run, { folder: e.folder, frames: e.frames, shots: e.shots });
  else if (e.kind === "frame") run.steps[`f${e.index}`] = e;
  else if (e.kind === "clip") run.steps[`c${e.index}`] = e;
  else if (e.kind === "final") run.final = e;
  else if (e.kind === "warning") run.warnings.push(e.message);
  else if (e.kind === "done") run.summary = e;
  else if (e.kind === "fatal") run.fatal = e.message;
}
function renderRun() {
  $("run").disabled = run.running; $("stop").disabled = !run.running; $("open").disabled = !run.folder;
  const rows = [];
  const line = (key, title, frame) => {
    const e = run.steps[key];
    const row = el("div", { className: "step" });
    const thumb = frame && e?.file ? el("img", { className: "thumb", src: fileUrl(e.file) }) : el("div", { className: "thumb" });
    const text = el("div");
    const state = el("span", { className: e ? (e.ok ? "ok" : "bad") : "muted", textContent: !e ? (run.running ? "chờ" : "") : e.ok ? "xong" : "lỗi" });
    text.append(el("div", { textContent: `${title}${e?.label ? ": " + e.label : ""} ` }));
    text.firstChild.append(state);
    if (e?.message) text.append(el("div", { className: "msg", textContent: e.message, title: e.message }));
    row.append(thumb, text);
    rows.push(row);
  };
  if (run.running || run.summary || run.fatal) {
    for (let i = 0; i < run.frames; i++) line(`f${i}`, `Khung ${i + 1}`, true);
    for (let i = 1; i <= run.shots; i++) line(`c${i}`, `Cảnh ${i}`, false);
    if (run.running && !run.shots) rows.push(el("div", { className: "muted", textContent: "Đang lập kế hoạch cảnh…" }));
  }
  for (const w of run.warnings) rows.push(el("div", { className: "warn small", textContent: w }));
  if (run.fatal) rows.push(el("div", { className: "bad", textContent: run.fatal }));
  if (run.summary?.message) rows.push(el("div", { className: "warn", textContent: run.summary.message }));
  $("steps").replaceChildren(...rows);
  const done = Object.values(run.steps).filter((s) => s.ok).length;
  $("status").textContent = run.running ? (run.frames ? `đang chạy · ${done}/${run.frames + run.shots} bước` : "đang chạy") : run.summary ? (run.summary.ok ? "xong" : "chưa ra video") : "";
  const final = $("final");
  if (run.final && final.dataset.file !== run.final.file) {
    final.dataset.file = run.final.file;
    final.replaceChildren(el("div", { className: "ok", textContent: `Video ${run.final.seconds}s, ${run.final.width}×${run.final.height}` }), el("video", { src: fileUrl(run.final.file), controls: true, playsInline: true }));
  } else if (!run.final) { final.dataset.file = ""; final.replaceChildren(); }
}
let polling = false;
async function poll() {
  if (polling) return;
  polling = true;
  try {
    for (;;) {
      const r = await fetch(`/api/run?since=${run.since}`).then((x) => x.json());
      r.events.forEach(onEvent);
      run.since = r.next; run.running = r.running; run.folder = r.folder || run.folder;
      renderRun();
      if (!r.running) break;
      await new Promise((done) => setTimeout(done, 1500));
    }
  } catch { run.running = false; renderRun(); }
  polling = false;
}
$("run").onclick = async () => {
  if (!make.photo) return toast("Thêm ảnh sản phẩm");
  if (!make.name.trim()) { $("name").focus(); return toast("Điền tên sản phẩm"); }
  const job = { product: make.name.trim(), photo: make.photo, model: make.model, reference: make.reference, music: make.music, length: make.length, aspect: make.aspect, captions: make.captions ?? DATA.settings.captions === true, resolution: DATA.settings.defaultResolution };
  Object.assign(run, { since: 0, steps: {}, final: null, folder: "", summary: null, fatal: "", warnings: [], frames: 0, shots: 0 });
  const r = await fetch("/api/run", { method: "POST", body: JSON.stringify(job) }).catch(() => null);
  const body = r && (await r.json().catch(() => ({})));
  if (!r?.ok) return toast(body?.error || "Không bắt đầu được. Đóng và mở lại Product Video.");
  run.running = true; renderRun(); poll();
};
$("stop").onclick = async () => { await fetch("/api/stop", { method: "POST" }).catch(() => {}); toast("Đang dừng…"); };
$("open").onclick = () => fetch("/api/open-folder", { method: "POST" }).catch(() => {});

// Pages: Tạo video, Phân tích video mẫu, Hiệu ứng, Góc máy (the one last open comes back).
const PAGES = ["make", "analyze", "fx", "angles"];
function showPage(page) {
  if (!PAGES.includes(page)) page = "make";
  for (const p of PAGES) $(p).hidden = p !== page;
  for (const b of $("tabs").children) b.setAttribute("aria-pressed", b.dataset.page === page);
  store.set("page", page);
  if (page === "analyze") loadAnalyzeList();
  if (page === "fx" && !$("fxCards").firstChild) renderFx();
  if (page === "angles" && !$("angleCards").firstChild) renderAngles();
}
for (const b of $("tabs").children) b.onclick = () => showPage(b.dataset.page);

// Phân tích video mẫu: a library video (or the sample chosen on Tạo video) read by src/analyze-reference.ps1 the way the
// run reads it (src/plan.ps1); each scene's angle can be set, and Lưu kế hoạch writes them beside the video
// (<video>.json), where the run takes its scenes and angles from.
const an = { video: "", result: null };
async function loadAnalyzeList() {
  const r = await fetch("/api/analyze/videos").then((x) => x.json()).catch(() => ({ videos: [] }));
  const options = r.videos.map((v) => ({ value: v.path, textContent: `${v.name}${v.plan ? " (có kế hoạch)" : ""}` }));
  if (make.reference && !options.some((o) => o.value === make.reference)) options.unshift({ value: make.reference, textContent: "Video mẫu đang chọn ở Tạo video" });
  $("anList").replaceChildren(...(options.length ? options : [{ value: "", textContent: "Chưa có video: chọn video mẫu ở Tạo video hoặc Từ kho" }]).map((o) => el("option", o)));
  const last = an.video || store.get("analyze", "");
  if (last && options.some((o) => o.value === last)) $("anList").value = last;
  pickAnalyze($("anList").value);
}
function pickAnalyze(video) {
  if (video === an.video && $("anBox").firstChild) return;
  an.video = video; an.result = null; store.set("analyze", video);
  $("anBox").replaceChildren(video ? el("video", { src: fileUrl(video), muted: true, controls: true, playsInline: true }) : Object.assign(el("span"), { innerHTML: "<b>Chưa có video</b>" }));
  $("anRun").disabled = !video; $("anUse").disabled = !video;
  renderShots();
}
$("anList").onchange = (e) => pickAnalyze(e.target.value);
$("anUse").onclick = () => { make.reference = an.video; persist(); render(); showPage("make"); };
const angleOptions = () => (DATA.angles?.groups || []).map((g) => {
  const group = el("optgroup", { label: g.label });
  group.append(...DATA.angles.list.filter((a) => a.group === g.id).map((a) => el("option", { value: a.id, textContent: a.label })));
  return group;
});
function renderShots() {
  const r = an.result;
  $("anSave").disabled = !r?.shots?.length;
  if (!r) { $("anStatus").textContent = ""; return $("anShots").replaceChildren(); }
  $("anStatus").textContent = `${r.shots.length} cảnh · ${r.seconds}s · ${r.width}×${r.height} · thành ${r.clips} cảnh ngắn${r.planned ? " · theo kế hoạch đã lưu" : ""}`;
  $("anNote").value = r.note || "";
  const rows = (r.warnings || []).map((w) => el("div", { className: "warn small", textContent: w }));
  for (const s of r.shots) {
    const row = el("div", { className: "shot" });
    const thumb = s.thumb ? el("img", { src: fileUrl(s.thumb), title: "Xem cảnh này" }) : el("div", { className: "noimg" });
    thumb.onclick = () => { const v = $("anBox").querySelector("video"); if (v) { v.currentTime = s.start; v.play().catch(() => {}); } };
    const info = el("div");
    info.append(el("div", { className: "when", textContent: `Cảnh ${s.index} · ${s.start}s → ${Math.round((s.start + s.seconds) * 100) / 100}s (${s.seconds}s)` }), el("div", { className: "move", textContent: `Máy: ${s.move.vi}` }), el("div", { className: "phases", textContent: `Thành ${s.clips} cảnh ngắn: cảnh đầu theo góc bên phải, các cảnh sau lần lượt đổi góc` }));
    const pick = el("div");
    const select = el("select", { title: "Góc của cảnh" });
    select.append(...angleOptions());
    select.value = s.angle;
    const desc = el("div", { className: "desc" });
    const describe = () => { desc.textContent = DATA.angles.list.find((a) => a.id === select.value)?.description || ""; };
    select.onchange = () => { s.angle = select.value; describe(); };
    describe();
    pick.append(Object.assign(el("label", { textContent: "Góc" }), { style: "margin-top:0" }), select, desc);
    row.append(thumb, info, pick);
    rows.push(row);
  }
  $("anShots").replaceChildren(...rows);
}
$("anRun").onclick = async () => {
  if (!an.video) return;
  $("anRun").disabled = true; $("anSave").disabled = true;
  $("anStatus").textContent = "đang phân tích (ffmpeg, khoảng 10–60 giây)…";
  $("anShots").replaceChildren();
  const r = await fetch("/api/analyze", { method: "POST", body: JSON.stringify({ video: an.video }) }).catch(() => null);
  const body = r && (await r.json().catch(() => ({})));
  $("anRun").disabled = false;
  if (!r?.ok || !body?.ok) { $("anStatus").textContent = ""; return toast(body?.error || "Không phân tích được."); }
  an.result = body; renderShots();
};
$("anSave").onclick = async () => {
  if (!an.result) return;
  const shots = an.result.shots.map((s) => ({ start: s.start, angle: s.angle }));
  const r = await fetch("/api/analyze/save", { method: "POST", body: JSON.stringify({ video: an.video, note: $("anNote").value, shots }) }).catch(() => null);
  const body = r && (await r.json().catch(() => ({})));
  if (!r?.ok) return toast(body?.error || "Chưa lưu được.");
  an.result.planned = true; renderShots(); toast("Đã lưu kế hoạch cạnh video");
  loadAnalyzeList();
};

Promise.all([fetch("/api/data").then((r) => r.json()), fetch("/api/ui-state").then((r) => r.json()).catch(() => ({}))]).then(([data, ui]) => {
  DATA = data;
  Object.assign(UI, ui);
  Object.assign(make, store.get(KEY, {}));
  $("name").value = make.name;
  for (const page of ["fx", "angles"]) { filterOf[page] = store.get(`filter:${page}`, "all"); filterDraw[page](); }
  if (make.length && !data.settings.lengths.includes(make.length)) make.length = 0;
  if (!data.settings.aspects.includes(make.aspect)) make.aspect = "auto";
  render(); renderRun(); poll();
  showPage(store.get("page", "make"));
}, () => toast("Không đọc được dữ liệu. Đóng và mở lại Product Video."));

</script>
